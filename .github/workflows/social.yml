name: Callnomic Social

# Runs in GitHub's cloud for free. Every ~5 min it:
#  - reads your Telegram approvals (button taps) and publishes approved posts
#  - generates the next draft when it's time and sends it to you for approval
# Nothing runs on your machine; nothing costs a subscription.

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (UTC) — GitHub's minimum cron interval. May still be delayed under load.
  workflow_dispatch:
    inputs:
      force_draft:
        description: "Force a new image-post draft this run (ignore the timer)"
        type: boolean
        default: false
      force_reel:
        description: "Force a new Reel draft this run (ignore the timer)"
        type: boolean
        default: false
      flagship:
        description: "Stage the hand-picked flagship launch set (approved). Publish with a normal run after."
        type: boolean
        default: false
      backlog:
        description: "Recover unpublished drafts before the engine runs"
        type: choice
        default: "none"
        options:
          - none
          - pending # approve everything still pending, publish this run
          - expired # revive expired drafts too, dripped ~2/day
      watch_minutes:
        description: "Minutes to stay online long-polling Telegram (blank = repo default)"
        type: string
        default: ""

# Never let two runs mutate state at the same time.
concurrency:
  group: callnomic-social
  cancel-in-progress: false

permissions:
  contents: write # needed to commit updated state/ back to the repo

jobs:
  tick:
    runs-on: ubuntu-latest
    # The run holds itself open watching Telegram, so cap it well under the default
    # 6h in case a long-poll ever wedges and blocks the concurrency group.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Only NEW Reels need ffmpeg — publishing an already-rendered one doesn't. A slow
      # or wedged apt mirror must not stop the run from publishing what's queued, so
      # this is capped and allowed to fail; the engine skips reel rendering without it.
      - name: Ensure ffmpeg (for Reels; no-op if already present)
        timeout-minutes: 4
        continue-on-error: true
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Stage flagship launch set (one-shot)
        if: ${{ inputs.flagship }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node src/flagship.js

      - name: Recover unpublished backlog (one-shot)
        if: ${{ inputs.backlog == 'pending' || inputs.backlog == 'expired' }}
        run: |
          if [ "${{ inputs.backlog }}" = "expired" ]; then
            node src/backlog.js --pending --expired --per-day 2 --skip-duplicates
          else
            node src/backlog.js --pending
          fi

      - name: Run engine
        if: ${{ !inputs.flagship }}
        env:
          # Telegram approval bot
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # LinkedIn
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          # Instagram
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_BASE: ${{ vars.IG_GRAPH_BASE }}
          # Optional AI freshness (leave unset to stay 100% free)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_FRESH: ${{ vars.AI_FRESH }}
          # Behaviour knobs (Repository Variables, all optional)
          PLATFORMS: ${{ vars.PLATFORMS }}
          POST_INTERVAL_HOURS: ${{ vars.POST_INTERVAL_HOURS }}
          PENDING_TTL_HOURS: ${{ vars.PENDING_TTL_HOURS }}
          MAX_PENDING: ${{ vars.MAX_PENDING }}
          FORCE_DRAFT: ${{ inputs.force_draft && '1' || '' }}
          REMIND_AFTER_HOURS: ${{ vars.REMIND_AFTER_HOURS }}
          REMIND_REPEAT_HOURS: ${{ vars.REMIND_REPEAT_HOURS }}
          # Stay online long-polling Telegram so a button tap is acted on in seconds.
          # GitHub throttles the 5-minute cron to roughly one run an hour, so without
          # this the approval you tap sits unprocessed long enough to look broken.
          WATCH_MINUTES: ${{ inputs.watch_minutes || vars.WATCH_MINUTES || '20' }}
          # Educational Reels (Instagram only)
          REELS_ENABLED: ${{ vars.REELS_ENABLED }}
          REEL_INTERVAL_HOURS: ${{ vars.REEL_INTERVAL_HOURS }}
          MAX_PENDING_REELS: ${{ vars.MAX_PENDING_REELS }}
          FORCE_REEL: ${{ inputs.force_reel && '1' || '' }}
          # So Instagram can fetch the committed image from this repo
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node src/run.js

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "callnomic-bot"
          git config user.email "bot@callnomicsolutions.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "social: update state [skip ci]"
          # Runs are long now, so the branch can move underneath us. Never lose the
          # record of what was already published to a rejected push.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            sleep 5
          done
          git push
